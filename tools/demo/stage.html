<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo stage</title>
<!-- Used only by record-demo.js: shows each page of the project in a frame, with a visible cursor,
     plain caption bars and title cards on top, and records the tab. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
  /* the page being shown fills the top; captions have their own strip below it, so they never cover it */
  #f { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - 76px); border: 0; background: #fff; }
  #strip { position: fixed; left: 0; right: 0; bottom: 0; height: 76px; background: #24272c; border-top: 1px solid #3a3e45; }
  #cursor { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; transform: translate(-200px, -200px); }
  #cursor svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .ping { position: fixed; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid #555; z-index: 9; pointer-events: none; animation: ping .45s ease-out forwards; }
  @keyframes ping { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
  #cap { position: fixed; left: 0; right: 0; bottom: 0; height: 76px; z-index: 8; pointer-events: none; visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px;
    color: #fff; font-size: 21px; line-height: 1.3; text-align: center; }
  #cap small { display: block; font-size: 15px; color: #b9bdc4; margin-top: 3px; }
  #cap.show { visibility: visible; }
  #card { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1f2227; color: #f2f3f5; text-align: center; opacity: 0; transition: opacity .45s; pointer-events: none; padding: 0 80px; }
  #card.show { opacity: 1; }
  #card h1 { font-size: 54px; font-weight: 600; margin: 0 0 18px; }
  #card p { font-size: 24px; line-height: 1.45; color: #d3d6db; margin: 6px 0; max-width: 980px; }
  #card ul { text-align: left; font-size: 23px; line-height: 1.6; color: #d3d6db; margin: 8px 0 0; }
  #card .note { margin-top: 26px; font-size: 18px; color: #a3a8b0; }
  #card .url { margin-top: 24px; font-size: 22px; color: #f2f3f5; font-family: Consolas, monospace; }
</style>
</head>
<body>
<iframe id="f" src="about:blank"></iframe>
<div id="strip"></div>
<div id="card"></div>
<div id="cap"></div>
<div id="cursor"><svg width="22" height="26" viewBox="0 0 26 30"><path d="M2 2 L2 24 L8 18.5 L12.5 28 L16.5 26.2 L12.2 17 L20 17 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg></div>
<script>
const frame = document.getElementById('f'), cap = document.getElementById('cap'), card = document.getElementById('card'), cursor = document.getElementById('cursor');
let rec = null, chunks = [];
const visible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; };
window.__demo = {
  doc: () => frame.contentDocument,
  win: () => frame.contentWindow,
  load(url) {
    return new Promise(res => { frame.onload = () => res(); frame.src = url; });
  },
  place(x, y) { cursor.style.transform = `translate(${x - 2}px, ${y - 2}px)`; },
  ping(x, y) { const p = document.createElement('div'); p.className = 'ping'; p.style.left = x + 'px'; p.style.top = y + 'px'; document.body.appendChild(p); setTimeout(() => p.remove(), 500); },
  caption(html) { cap.innerHTML = html; cap.classList.add('show'); },
  hide() { cap.classList.remove('show'); },
  card(html) { card.innerHTML = html; card.classList.add('show'); },
  uncard() { card.classList.remove('show'); },
  // centre of the first element in the frame matching sel (and containing text) that is on screen
  center(sel, text) {
    const h = frame.clientHeight;
    const onScreen = e => { const r = e.getBoundingClientRect(); return r.top >= 0 && r.bottom <= h - 10; };
    const el = [...frame.contentDocument.querySelectorAll(sel)].find(e => visible(e) && onScreen(e) && (!text || e.textContent.includes(text)));
    if (!el) throw new Error('not found: ' + sel + ' ' + (text || ''));
    const r = el.getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2), top: Math.round(r.top) };
  },
  scrollTo(y, smooth = true) { frame.contentWindow.scrollTo({ top: y, behavior: smooth ? 'smooth' : 'auto' }); },
  scrollIntoView(sel, text, block = 'start') {
    const el = [...frame.contentDocument.querySelectorAll(sel)].find(e => !text || e.textContent.includes(text));
    el.scrollIntoView({ behavior: 'smooth', block });
  },
  async startRec(bitrate) {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30, width: innerWidth, height: innerHeight }, preferCurrentTab: true, audio: false });
    const type = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: bitrate });
    chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.start(1000);
    return type;
  },
  async stopRec(url) {
    await new Promise(r => { rec.onstop = r; rec.stop(); });
    rec.stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType });
    await fetch(url, { method: 'PUT', body: blob });
    return blob.size;
  },
};
</script>
</body>
</html>
